name: check

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        node: [20, 24]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
